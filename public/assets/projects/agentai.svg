<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cyan-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-agent)" />
  
  <text x="400" y="60" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AgentAI Enterprise RAG Pipeline</text>
  <text x="400" y="85" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Automated Ingestion • ChromaDB Vectors • Hybrid Cloud/Local LLMs</text>

  <!-- Step 1: Ingestion -->
  <g transform="translate(80, 130)">
    <rect width="170" height="220" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    <circle cx="85" cy="45" r="24" fill="#0369a1" />
    <path d="M77 40 L85 32 L93 40 M85 32 L85 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text x="85" y="95" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Ingestion</text>
    <text x="85" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">PDF / MD Docs</text>
    <text x="85" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Recursive Splitter</text>
    <rect x="30" y="170" width="110" height="28" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" />
    <text x="85" y="188" fill="#e0f2fe" font-family="monospace" font-size="10" text-anchor="middle">Chunk: 500 toks</text>
  </g>

  <!-- Step 2: Vector DB -->
  <g transform="translate(315, 130)">
    <rect width="170" height="220" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <circle cx="85" cy="45" r="24" fill="#0891b2" />
    <rect x="73" y="37" width="24" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="73" y1="44" x2="97" y2="44" stroke="#ffffff" stroke-width="1.5" />
    <text x="85" y="95" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Vector Index</text>
    <text x="85" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">ChromaDB Embeddings</text>
    <text x="85" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Semantic Indexing</text>
    <rect x="30" y="170" width="110" height="28" rx="6" fill="#0891b2" fill-opacity="0.3" stroke="#22d3ee" />
    <text x="85" y="188" fill="#cffafe" font-family="monospace" font-size="10" text-anchor="middle">Top-k Neighbors</text>
  </g>

  <!-- Step 3: Synthesis -->
  <g transform="translate(550, 130)">
    <rect width="170" height="220" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <circle cx="85" cy="45" r="24" fill="#059669" />
    <path d="M75 45 C75 35, 95 35, 95 45 C95 55, 75 55, 75 45" stroke="#ffffff" stroke-width="2" fill="none" />
    <text x="85" y="95" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. AI Reasoning</text>
    <text x="85" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Hybrid Models</text>
    <text x="85" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">OpenAI / Ollama</text>
    <rect x="30" y="170" width="110" height="28" rx="6" fill="#059669" fill-opacity="0.3" stroke="#34d399" />
    <text x="85" y="188" fill="#d1fae5" font-family="monospace" font-size="10" text-anchor="middle">Grounded Output</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 255 240 L 310 240" stroke="url(#cyan-flow)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="315,240 305,235 305,245" fill="#06b6d4" />

  <path d="M 490 240 L 545 240" stroke="url(#cyan-flow)" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="550,240 540,235 540,245" fill="#10b981" />

  <!-- Bottom container label -->
  <rect x="220" y="380" width="360" height="36" rx="18" fill="#1e293b" stroke="#334155" />
  <text x="400" y="403" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">🐳 Docker Compose Orchestrated Microservices</text>
</svg>