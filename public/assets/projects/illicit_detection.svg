<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-nlp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180219" />
      <stop offset="50%" stop-color="#2e0854" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-nlp)" />
  
  <text x="400" y="55" fill="#f472b6" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Detection of Illicit Online Communications</text>
  <text x="400" y="80" fill="#fbcfe8" font-family="sans-serif" font-size="12" text-anchor="middle">NLP Preprocessing • TF-IDF Vector Space • SVM vs. Naïve Bayes</text>

  <!-- Left: Feature Space Graph -->
  <g transform="translate(90, 110)">
    <rect width="280" height="280" rx="16" fill="#1e0a2d" stroke="#a21caf" stroke-width="2" />
    <text x="20" y="30" fill="#f5d0fe" font-family="sans-serif" font-size="12" font-weight="bold">SVM Decision Boundary</text>
    
    <!-- Axes -->
    <line x1="40" y1="240" x2="240" y2="240" stroke="#86198f" stroke-width="1.5" />
    <line x1="40" y1="240" x2="40" y2="60" stroke="#86198f" stroke-width="1.5" />
    
    <!-- Hyperplane -->
    <line x1="60" y1="220" x2="220" y2="80" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4,3" />
    
    <!-- Red (Suspicious) Points -->
    <circle cx="170" cy="90" r="5" fill="#f43f5e" />
    <circle cx="200" cy="110" r="6" fill="#f43f5e" />
    <circle cx="160" cy="130" r="5" fill="#f43f5e" />
    <circle cx="185" cy="150" r="5" fill="#f43f5e" />

    <!-- Green (Benign) Points -->
    <circle cx="80" cy="210" r="5" fill="#10b981" />
    <circle cx="110" cy="190" r="6" fill="#10b981" />
    <circle cx="95" cy="170" r="5" fill="#10b981" />
    <circle cx="130" cy="210" r="5" fill="#10b981" />

    <text x="140" y="265" fill="#f0abfc" font-family="monospace" font-size="10" text-anchor="middle">TF-IDF N-gram Weighting</text>
  </g>

  <!-- Right: Metrics Breakdown -->
  <g transform="translate(410, 110)">
    <rect width="300" height="280" rx="16" fill="#1e0a2d" stroke="#a21caf" stroke-width="2" />
    <text x="20" y="30" fill="#f5d0fe" font-family="sans-serif" font-size="12" font-weight="bold">Classification Performance</text>

    <g transform="translate(20, 60)">
      <text x="0" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="11">Precision (Low False Positives)</text>
      <rect x="0" y="25" width="260" height="12" rx="6" fill="#3b0764" />
      <rect x="0" y="25" width="242" height="12" rx="6" fill="#ec4899" />
      <text x="245" y="20" fill="#f472b6" font-family="monospace" font-size="10" text-anchor="end">93.2%</text>
    </g>

    <g transform="translate(20, 115)">
      <text x="0" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="11">Recall (Threat Detection Rate)</text>
      <rect x="0" y="25" width="260" height="12" rx="6" fill="#3b0764" />
      <rect x="0" y="25" width="235" height="12" rx="6" fill="#a855f7" />
      <text x="245" y="20" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="end">90.5%</text>
    </g>

    <g transform="translate(20, 170)">
      <text x="0" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="11">F-Measure / Cross Validation</text>
      <rect x="0" y="25" width="260" height="12" rx="6" fill="#3b0764" />
      <rect x="0" y="25" width="238" height="12" rx="6" fill="#06b6d4" />
      <text x="245" y="20" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="end">91.8%</text>
    </g>

    <rect x="20" y="230" width="260" height="32" rx="6" fill="#701a75" />
    <text x="150" y="251" fill="#fdf4ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Evaluated against adversarial obfuscation</text>
  </g>
</svg>