<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192c" />
      <stop offset="50%" stop-color="#0e2948" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-cam)" />

  <text x="400" y="55" fill="#60a5fa" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Computer Vision Document Scanner</text>
  <text x="400" y="80" fill="#93c5fd" font-family="sans-serif" font-size="12" text-anchor="middle">Canny Edge Detection • 4-Point Perspective Warp • Adaptive Binarization</text>

  <!-- Left: Skewed Camera Input -->
  <g transform="translate(110, 110)">
    <rect width="240" height="280" rx="14" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="20" y="30" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">1. Raw Skewed Capture</text>
    
    <!-- Skewed Polygon -->
    <polygon points="50,70 190,90 160,240 30,210" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    
    <!-- 4 Detected Corner Points -->
    <circle cx="50" cy="70" r="6" fill="#ef4444" />
    <circle cx="190" cy="90" r="6" fill="#ef4444" />
    <circle cx="160" cy="240" r="6" fill="#ef4444" />
    <circle cx="30" cy="210" r="6" fill="#ef4444" />
    
    <text x="120" y="265" fill="#60a5fa" font-family="monospace" font-size="10" text-anchor="middle">Contour Detected</text>
  </g>

  <!-- Right: Flattened Bird's Eye Scanned Document -->
  <g transform="translate(450, 110)">
    <rect width="240" height="280" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <text x="20" y="30" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold">2. Perspective Corrected Scan</text>

    <!-- Flattened Rect -->
    <rect x="40" y="55" width="160" height="195" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
    
    <!-- Document Text Lines -->
    <line x1="55" y1="80" x2="160" y2="80" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
    <line x1="55" y1="100" x2="180" y2="100" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="115" x2="170" y2="115" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="130" x2="150" y2="130" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="155" x2="180" y2="155" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="170" x2="165" y2="170" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="55" y1="185" x2="140" y2="185" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />

    <rect x="55" y="205" width="65" height="25" rx="4" fill="#10b981" />
    <text x="87" y="221" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OCR READY</text>
    
    <text x="120" y="265" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Warp Matrix Applied</text>
  </g>

  <!-- Transform Flow Line -->
  <path d="M 360 250 L 440 250" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="445,250 435,245 435,255" fill="#38bdf8" />
</svg>