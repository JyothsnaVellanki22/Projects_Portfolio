<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-star)" />
  
  <!-- Starfield dots -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="90" cy="80" r="1.5" />
    <circle cx="240" cy="40" r="1" />
    <circle cx="350" cy="90" r="2" />
    <circle cx="520" cy="50" r="1.5" />
    <circle cx="680" cy="70" r="1" />
    <circle cx="730" cy="140" r="2" />
    <circle cx="120" cy="340" r="1" />
    <circle cx="420" cy="380" r="1.5" />
    <circle cx="670" cy="360" r="1.2" />
  </g>

  <!-- Title Badge -->
  <rect x="230" y="45" width="340" height="42" rx="21" fill="#18181b" stroke="#eab308" stroke-width="1.5" />
  <text x="400" y="72" fill="#fef08a" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" text-anchor="middle">STAR WARS // SCRIPT RAG ENGINE</text>

  <!-- Screenplay Viewer Box -->
  <rect x="110" y="115" width="280" height="265" rx="14" fill="#111827" stroke="#374151" />
  <rect x="110" y="115" width="280" height="36" rx="14" fill="#1f2937" />
  <text x="130" y="138" fill="#e5e7eb" font-family="monospace" font-size="11">Ep IV-VI Screenplays (Trilogy)</text>
  
  <text x="130" y="180" fill="#9ca3af" font-family="monospace" font-size="11">LUKE: I cannot do it.</text>
  <text x="130" y="205" fill="#eab308" font-family="monospace" font-size="11">YODA: That is why you fail.</text>
  <line x1="130" y1="225" x2="360" y2="225" stroke="#374151" />
  <text x="130" y="250" fill="#60a5fa" font-family="monospace" font-size="10">Semantic Chunk: Dagobah Training</text>
  <text x="130" y="270" fill="#9ca3af" font-family="monospace" font-size="10">Timestamp: Act II, Scene 41</text>
  
  <rect x="130" y="310" width="240" height="45" rx="8" fill="#1e293b" stroke="#475569" />
  <text x="145" y="330" fill="#eab308" font-family="sans-serif" font-size="10" font-weight="bold">Vector Indexed in Qdrant</text>
  <text x="145" y="345" fill="#94a3b8" font-family="monospace" font-size="9">1,536-dim OpenAI Embeddings</text>

  <!-- Qdrant & FastAPI Box -->
  <rect x="420" y="115" width="270" height="265" rx="14" fill="#111827" stroke="#eab308" stroke-width="1.5" />
  <rect x="420" y="115" width="270" height="36" rx="14" fill="#27272a" />
  <text x="440" y="138" fill="#fef08a" font-family="monospace" font-size="11">Qdrant Vector DB + uv Engine</text>

  <!-- Match Card -->
  <g transform="translate(440, 165)">
    <rect width="230" height="55" rx="8" fill="#18181b" stroke="#ca8a04" />
    <text x="15" y="24" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold">Semantic Match: 98.4%</text>
    <text x="15" y="42" fill="#9ca3af" font-family="monospace" font-size="10">Query: "Yoda Dagobah advice"</text>
  </g>

  <!-- Fast Response Stream -->
  <g transform="translate(440, 235)">
    <rect width="230" height="80" rx="8" fill="#09090b" stroke="#3f3f46" />
    <text x="15" y="22" fill="#38bdf8" font-family="monospace" font-size="10">[FastAPI Response // uv]</text>
    <text x="15" y="40" fill="#e4e4e7" font-family="sans-serif" font-size="10">Yoda emphasizes belief and</text>
    <text x="15" y="55" fill="#e4e4e7" font-family="sans-serif" font-size="10">focus during the X-wing trial.</text>
    <circle cx="195" cy="68" r="4" fill="#eab308" />
  </g>

  <rect x="440" y="330" width="230" height="28" rx="6" fill="#854d0e" fill-opacity="0.3" stroke="#eab308" />
  <text x="555" y="348" fill="#fde047" font-family="monospace" font-size="10" text-anchor="middle">Python 3.12 • React Vite Frontend</text>
</svg>